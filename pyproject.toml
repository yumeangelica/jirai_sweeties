[project]
name = "jirai-sweeties"
version = "1.9.1"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.5.1",
    "cssselect>=1.5.0",
    "curl-cffi>=0.16.0",
    "discord-py>=2.7.1",
    "lxml>=6.1.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "types-aiofiles>=25.1.0.20260518",
]

[tool.uv]
# rich is only imported by curl-cffi's CLI (curl_cffi/cli/), which this app
# never runs; dropping it keeps rich+pygments+markdown-it out of the image.
override-dependencies = [
    "rich; sys_platform == 'never'",
]
